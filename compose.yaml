name: aitrainer
services:
  db:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aitrainer}
      POSTGRES_USER: ${POSTGRES_USER:-aitrainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aitrainer_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent:
    build:
      context: ./services/agent
      secrets: [extra_ca]
    environment:
      AGENT_PROVIDER: ${AGENT_PROVIDER:-demo}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./services/backend
      secrets: [extra_ca]
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      DB_HOST: db
      DB_NAME: ${POSTGRES_DB:-aitrainer}
      DB_USER: ${POSTGRES_USER:-aitrainer}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-aitrainer_local}
      AGENT_URL: http://agent:8001
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8081","http://localhost:19006"]}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./services/backend
      secrets: [extra_ca]
    environment: *backend-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mobile:
    profiles: ["mobile"]
    build:
      context: ./apps/mobile
      secrets: [extra_ca]
    ports:
      - "8081:8081"
    environment:
      BROWSER: none
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
      REACT_NATIVE_PACKAGER_HOSTNAME: ${REACT_NATIVE_PACKAGER_HOSTNAME:-localhost}
    stdin_open: true
    tty: true
    depends_on:
      backend:
        condition: service_healthy

secrets:
  # Optional PEM root certificate trusted during image builds (see README).
  extra_ca:
    environment: EXTRA_CA_CERT_PEM

volumes:
  postgres_data:
